<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b3a">
  <meta name="description" content="Paciência Klondike estilo Windows 3.1">
  <title>SolitaireXP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body data-screen="menu">
  <div id="app">
    <section class="screen-menu">
      <div class="menu-card">
        <h1>SolitaireXP</h1>
        <p>Paciência Klondike — estilo Windows 3.1</p>
        <div class="menu-actions">
          <button id="btn-new-game" type="button">Novo jogo</button>
          <button id="btn-continue" type="button">Continuar</button>
        </div>
      </div>
    </section>

    <section class="screen-game">
      <div class="toolbar">
        <button id="btn-new-from-game" type="button">Novo jogo</button>
        <button id="btn-auto-complete" type="button" hidden>Completar automaticamente</button>
      </div>

      <div id="hud">
        <div class="stat"><span>Pontos</span><strong data-score>0</strong></div>
        <div class="stat"><span>Tempo</span><strong data-time>00:00</strong></div>
        <div class="stat"><span>Jogadas</span><strong data-moves>0</strong></div>
        <div class="stat"><span>Recorde</span><strong data-best>0</strong></div>
      </div>

      <div id="game-root"></div>
    </section>
  </div>

  <div id="drag-layer"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
